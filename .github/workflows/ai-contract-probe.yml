name: Inspect Blunder public AI backend
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ai-contract-probe.mjs"
      - ".github/workflows/ai-contract-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/ai-contract-probe.mjs
